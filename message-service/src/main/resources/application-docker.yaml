server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: message-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_message:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9093}

  cache:
    type: redis
    redis:
      time-to-live: 3m
      cache-null-values: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

grpc:
  client:
    user-service:
      address: ${GRPC_CLIENT_USER_SERVICE_ADDRESS:static://user-service:6565}
      negotiation-type: plaintext
    group-chat-service:
      address: ${GRPC_CLIENT_GROUP_CHAT_SERVICE_ADDRESS:static://group-chat-service:6566}
      negotiation-type: plaintext
    personal-chat-service:
      address: ${GRPC_CLIENT_PERSONAL_CHAT_SERVICE_ADDRESS:static://personal-chat-service:6567}
      negotiation-type: plaintext

redis:
  ttl: 2