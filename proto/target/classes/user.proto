syntax = "proto3";
package com.messenger.grpc;

service UserService {
  rpc ValidateUsersExist(ValidateUsersExistRequest) returns (UsersExistResponse);
}

message ValidateUsersExistRequest {
  repeated int64 userIds = 1;
}

message UsersExistResponse {
  message UserExistence {
    int64 userId = 1;
    bool exists = 2;
    bool is_active = 3;
  }
  repeated UserExistence results = 1;
}