syntax = "proto3";
package com.messenger.grpc;

message ValidateUserCanSendMessageRequest {
  int64 chat_id = 1;
  int64 sender_id = 2;
}

message ValidateUserCanSendMessageResponse {
  bool user_can_send_message = 1;
}

message GetChatMembersIdsRequest {
  int64 chat_id = 1;
}

message GetChatMembersIdsResponse {
  repeated int64 member_ids = 1;
}

message ValidateUserIsChatMemberRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

message ValidateUserIsChatMemberResponse {
  bool is_chat_member = 1;
}

service ChatService {
  rpc ValidateUserCanSendMessage(ValidateUserCanSendMessageRequest) returns (ValidateUserCanSendMessageResponse);
  rpc GetChatMembersIds(GetChatMembersIdsRequest) returns (GetChatMembersIdsResponse);
  rpc ValidateUserIsChatMember(ValidateUserIsChatMemberRequest) returns (ValidateUserIsChatMemberResponse);
}