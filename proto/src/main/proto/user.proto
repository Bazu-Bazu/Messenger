syntax = "proto3";
package com.messenger.grpc;

service UserService {
  rpc ValidateUsersExist(ValidateUsersExistRequest) returns (UsersExistResponse);
  rpc UsersInfo(UsersInfoRequest) returns (UsersInfoResponse);
}

message ValidateUsersExistRequest {
  repeated int64 userIds = 1;
}

message UsersExistResponse {
  message UserExistence {
    int64 userId = 1;
    bool exists = 2;
    bool isActive = 3;
  }
  repeated UserExistence results = 1;
}

message UsersInfoRequest {
  repeated int64 userIds = 1;
}

message UsersInfoResponse {
  message UserInfo {
    int64 userId = 1;
    string username = 2;
    string avatarUrl = 3;
    string status = 4;
    string bio = 5;
  }
  repeated UserInfo results = 1;
}