syntax = "proto3";
package group_chat;

service GroupChatService {
  rpc ValidateMemberRightsInGroupChat(ValidateMemberRightsInGroupChatRequest)
      returns (ValidateMemberRightsInGroupChatRequestResponse);
}

message ValidateMemberRightsInGroupChatRequest {
  int64 userId = 1;
  int64 chatId = 2;
}

message ValidateMemberRightsInGroupChatRequestResponse {
  int64 userId = 1;
  int64 chatId = 2;
  bool canSendMessage = 3;
  bool canGetMessage = 4;
}
