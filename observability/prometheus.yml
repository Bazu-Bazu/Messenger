global:
  scrape_interval: 5s

scrape_configs:

  # =============================
  # API GATEWAY
  # =============================
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '.*api-gateway.*'
        action: keep
      - source_labels: [__meta_docker_container_network_ip]
        target_label: __address__
        replacement: '$1:8080'


  # =============================
  # DISCOVERY SERVICE
  # =============================
