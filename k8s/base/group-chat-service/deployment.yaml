apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-chat-service
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: group-chat-service
  template:
    metadata:
      labels:
        app: group-chat-service
    spec:
      containers:
        - name: group-chat-service
          image: bazubazu/group-chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
            - containerPort: 6566
          envFrom:
            - configMapRef:
                name: group-chat-service-config