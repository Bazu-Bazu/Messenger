apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-chat-service
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-chat-service
  template:
    metadata:
      labels:
        app: personal-chat-service
    spec:
      containers:
        - name: personal-chat-service
          image: bazubazu/personal-chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
            - containerPort: 6567
          envFrom:
            - configMapRef:
                name: personal-chat-service-config