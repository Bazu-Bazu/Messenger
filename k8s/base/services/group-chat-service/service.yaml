apiVersion: v1
kind: Service
metadata:
  name: group-chat-service
  namespace: messenger
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: group-chat-service
  ports:
    - name: http
      port: 80
      targetPort: 8084
    - name: grpc
      port: 6566
      targetPort: 6566