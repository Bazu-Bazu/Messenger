apiVersion: v1
kind: ConfigMap
metadata:
  name: group-chat-service-config
  namespace: messenger
data:
  SPRING_PROFILES_ACTIVE: k8s
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-group-chat:5432/postgres
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: "6379"
  SERVER_PORT: "8084"
  GRPC_SERVER_PORT: "6566"