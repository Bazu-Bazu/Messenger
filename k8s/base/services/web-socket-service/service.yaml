apiVersion: v1
kind: Service
metadata:
  name: web-socket-service
  namespace: messenger
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app: web-socket-service
  ports:
    - port: 80
      targetPort: 8086