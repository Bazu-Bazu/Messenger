apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: media-service
          image: bazubazu/media-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: media-service-config
            - secretRef:
                name: media-service-secret