apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: messenger
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 80
      targetPort: 8082
    - name: grpc
      port: 6565
      targetPort: 6565