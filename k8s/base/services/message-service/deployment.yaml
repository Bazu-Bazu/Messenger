apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: message-service
          image: bazubazu/message-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
            - containerPort: 6568
          envFrom:
            - configMapRef:
                name: message-service-config
            - secretRef:
                name: message-service-secret