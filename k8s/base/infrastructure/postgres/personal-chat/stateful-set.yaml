apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-personal-chat
  namespace: messenger
spec:
  serviceName: "postgres-personal-chat"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-personal-chat
  template:
    metadata:
      labels:
        app: postgres-personal-chat
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-personal-chat-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-personal-chat-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-personal-chat-secret
                  key: POSTGRES_DB
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi