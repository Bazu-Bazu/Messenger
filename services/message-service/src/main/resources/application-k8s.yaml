server:
  port: ${SERVER_PORT}

spring:
  application:
    name: message-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db.migrations/db.migrations.yaml

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  cache:
    type: redis
    redis:
      time-to-live: 3m
      cache-null-values: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

grpc:
  client:
    user-service:
      address: dns:///user-service:6565
      negotiation-type: plaintext
      default-load-balancing-policy: round_robin
    group-chat-service:
      address: dns:///group-chat-service:6566
      negotiation-type: plaintext
      default-load-balancing-policy: round_robin
    personal-chat-service:
      address: dns:///personal-chat-service:6567
      negotiation-type: plaintext
      default-load-balancing-policy: round_robin

  server:
    port: ${GRPC_SERVER_PORT}

redis:
  ttl: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true