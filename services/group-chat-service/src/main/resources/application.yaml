server:
  port: 8084

spring:
  application:
    name: group-chat-service

  datasource:
    url: jdbc:postgresql://localhost:5435/postgres
    username: postgres
    password: postgres

    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: redis
    redis:
      time-to-live: 3m
      cache-null-values: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: group-chat-service-group
      auto-offset-reset: earliest

grpc:
  server:
    port: 6566

  client:
    user-service:
      address: static://localhost:6565
      negotiation-type: plaintext

redis:
  ttl: 2