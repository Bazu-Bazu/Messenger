server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-registration
          uri: http://localhost:8082
          predicates:
            - Path=/api/register
            - Method=POST
          filters:
            - RewritePath=/api/register, /users/register