server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: sso-service
          uri: http://sso-service:8081
          predicates:
            - Path=/auth/**

        - id: user-service-users
          uri: http://user-service:8082
          predicates:
            - Path=/users/**

        - id: user-service-profile
          uri: http://user-service:8082
          predicates:
            - Path=/profile/**

        - id: personal-chat-service
          uri: http://personal-chat-service:8083
          predicates:
            - Path=/chats/personal/**

        - id: group-chat-service-chats
          uri: http://group-chat-service:8084
          predicates:
            - Path=/chats/group/**

        - id: group-chat-service-members
          uri: http://group-chat-service:8084
          predicates:
            - Path=/chats/group/members/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

