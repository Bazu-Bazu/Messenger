server:
  port: 8081

spring:
  application:
    name: sso-service

  datasource:
    url: jdbc:postgresql://postgres_db:5433/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect