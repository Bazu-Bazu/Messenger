volumes:
  postgres_personal-chat:
  postgres_group-chat:
  postgres_message:
  postgres_media:
  postgres_chat:
  postgres_web-socket:
  redis:
  jenkins_home:

networks:
  burkina-network:
    name: burkina-network
    driver: bridge