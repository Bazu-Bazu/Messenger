services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - burkina-network

  postgres_personal-chat:
    image: postgres:16
    container_name: postgres_personal-chat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal-chat_db
    ports:
      - "5422:5432"
    volumes:
      - postgres_personal-chat:/var/lib/postgresql/data
    networks:
      - burkina-network

  postgres_group-chat:
    image: postgres:16
    container_name: postgres_group-chat-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group-chat_db
    ports:
      - "5423:5432"
    volumes:
      - postgres_group-chat:/var/lib/postgresql/data
    networks:
      - burkina-network

  postgres_message:
    image: postgres:16
    container_name: postgres_message
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_db
    ports:
      - "5424:5432"
    volumes:
      - postgres_message:/var/lib/postgresql/data
    networks:
      - burkina-network

  postgres_media:
    image: postgres:16
    container_name: postgres_media
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_db
    ports:
      - "5425:5432"
    volumes:
      - postgres_media:/var/lib/postgresql/data
    networks:
      - burkina-network

  postgres_web-socket:
    image: postgres:16
    container_name: postgres_web-socket
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web-socket_db
    ports:
      - "5426:5432"
    volumes:
      - postgres_web-socket:/var/lib/postgresql/data
    networks:
      - burkina-network

  postgres_chat:
    image: postgres:16
    container_name: postgres_chat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_db
    ports:
      - "5427:5432"
    volumes:
      - postgres_chat:/var/lib/postgresql/data
    networks:
      - burkina-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper_mes
    ports:
      - "2181:2181"
    networks:
      - burkina-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka-messenger
    hostname: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zookeeper
    networks:
      - burkina-network

#  api-gateway:
#    build:
#      context: ./services/api-gateway
#      dockerfile: Dockerfile
#    container_name: api-gateway
#    depends_on:
#      - discovery-service
#    environment:
#      SPRING_PROFILES_ACTIVE: dev
#      SERVER_PORT: 8080
#    ports:
#      - "8080:8080"

  personal-chat-service:
    build:
      context: ./services/personal-chat-service
      dockerfile: Dockerfile
    container_name: personal-chat-service
    depends_on:
      - postgres_personal-chat
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_personal-chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-gateway:8080
    ports:
      - "8071:8080"
    networks:
      - burkina-network

  group-chat-service:
    build:
      context: ./services/group-chat-service
      dockerfile: Dockerfile
    container_name: group-chat-service
    depends_on:
      - postgres_group-chat
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_group-chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-gateway:8080
    ports:
      - "8072:8080"
    networks:
      - burkina-network

  message-service:
    build:
      context: ./services/message-service
      dockerfile: Dockerfile
    container_name: message-service
    depends_on:
      - postgres_message
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_message:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8085
    ports:
      - "8073:8080"
    networks:
      - burkina-network

  web-socket-service:
    build:
      context: ./services/web-socket-service
      dockerfile: Dockerfile
    container_name: web-socket-service
    depends_on:
      - redis
      - kafka
      - postgres_web-socket
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_web-socket:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - "8074:8080"
    networks:
      - burkina-network

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    volumes:
      - ./services/media-service/src/main/resources/application-secrets.yaml:/app/application-secrets.yml:ro
    container_name: media-service
    depends_on:
      - postgres_media
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_media:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_CONFIG_IMPORT: optional:file:/app/application-secrets.yml
      SERVER_PORT: 8080
    ports:
      - "8075:8080"
    networks:
      - burkina-network

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      - postgres_chat
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
    ports:
      - "8076:8080"
    networks:
      - burkina-network

