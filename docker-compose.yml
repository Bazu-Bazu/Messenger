services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  postgres_personal-chat:
    image: postgres:16
    container_name: postgres_personal-chat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal-chat_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_personal-chat:/var/lib/postgresql/data

  postgres_group-chat:
    image: postgres:16
    container_name: postgres_group-chat-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group-chat_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_group-chat:/var/lib/postgresql/data

  postgres_message:
    image: postgres:16
    container_name: postgres_message
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_message:/var/lib/postgresql/data

  postgres_media:
    image: postgres:16
    container_name: postgres_media
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_media:/var/lib/postgresql/data

  postgres_chat:
    image: postgres:16
    container_name: postgres_chat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_chat:/var/lib/postgresql/data

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper_z
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - '9093:9093'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zookeeper

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  discovery-service:
    build:
      context: ./services/discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8761
    ports:
      - "8761:8761"

  personal-chat-service:
    build:
      context: ./services/personal-chat-service
      dockerfile: Dockerfile
    container_name: personal-chat-service
    depends_on:
      - discovery-service
      - postgres_personal-chat
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_personal-chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8083
      GRPC_SERVER_PORT: 6567
    ports:
      - "8083:8083"
      - "6567:6567"

  group-chat-service:
    build:
      context: ./services/group-chat-service
      dockerfile: Dockerfile
    container_name: group-chat-service
    depends_on:
      - discovery-service
      - postgres_group-chat
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_group-chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8084
      GRPC_SERVER_PORT: 6566
    ports:
      - "8084:8084"
      - "6566:6566"

  message-service:
    build:
      context: ./services/message-service
      dockerfile: Dockerfile
    container_name: message-service
    depends_on:
      - discovery-service
      - postgres_message
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_message:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8085
      GRPC_SERVER_PORT: 6568
    ports:
      - "8085:8085"
      - "6568:6568"

  web-socket-service:
    build:
      context: ./services/web-socket-service
      dockerfile: Dockerfile
    container_name: web-socket-service
    depends_on:
      - discovery-service
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8086
    ports:
      - "8086:8086"

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    container_name: media-service
    depends_on:
      - discovery-service
      - postgres_media
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_media:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8087
    ports:
      - "8087:8087"

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      - discovery-service
      - postgres_chat
      - redis
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_chat:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8088
    ports:
      - "8088:8088"

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8888:8080"
      - "50000:50000"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_user:
  postgres_sso:
  postgres_personal-chat:
  postgres_group-chat:
  postgres_message:
  postgres_media:
  postgres_chat:
  redis:
  jenkins_home: