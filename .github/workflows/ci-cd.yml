name: Messenger CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # Позволяет запускать вручную

# Переменные окружения
env:
  REGISTRY: ghcr.io  # GitHub Container Registry
  IMAGE_PREFIX: messenger
  DOCKER_BUILDKIT: 1  # Включаем BuildKit для быстрой сборки

jobs:
  # Job 1: Сборка всех сервисов
  build-all-services:
    name: Build All Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - personal-chat-service
          - group-chat-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies for ${{ matrix.service }}
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('${{ matrix.service }}/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ matrix.service }}-
            ${{ runner.os }}-m2-

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean compile

      - name: Package ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

  # Job 2: Проверка Dockerfile
  validate-dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    needs: build-all-services  # Ждем завершения сборки

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Dockerfiles syntax
        run: |
          echo "🔍 Проверяем Dockerfiles..."
          for service in user-service personal-chat-service group-chat-service; do
            if [ -f "$service/Dockerfile" ]; then
              echo "✅ $service/Dockerfile существует"
              if grep -q "FROM " "$service/Dockerfile"; then
                echo "   ✅ Корректный FROM"
              else
                echo "   ❌ Ошибка: нет FROM"
                exit 1
              fi
            else
              echo "⚠️ $service/Dockerfile не найден"
            fi
          done

  # Job 3: Сборка Docker образов
  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate-dockerfiles
    if: github.event_name == 'push'  # Собираем только при пуше, не при PR

    strategy:
      matrix:
        service:
          - name: user-service
            dockerfile: user-service/Dockerfile
            context: user-service
          - name: personal-chat-service
            dockerfile: personal-chat-service/Dockerfile
            context: personal-chat-service
          - name: group-chat-service
            dockerfile: group-chat-service/Dockerfile
            context: group-chat-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DATE=$(date +'%Y%m%d')
          IMAGE_TAG="${DATE}-${SHORT_SHA}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${IMAGE_TAG}"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ steps.tag.outputs.image-tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest

  # Job 4: Уведомления
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build-all-services, build-docker-images]
    if: always()

    steps:
      - name: Determine build status
        id: status
        run: |
          if [ "${{ needs.build-all-services.result }}" == "success" ] && \
             ([ "${{ needs.build-docker-images.result }}" == "success" ] || [ "${{ needs.build-docker-images.result }}" == "skipped" ]); then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=🎉" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "emoji=🚨" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          echo "${{ steps.status.outputs.emoji }} Build ${{ steps.status.outputs.status }}"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🔗 Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"