<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SimpleChat Demo</title>
    <style>
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 5px; margin-bottom: 10px; }
        .message { margin: 5px 0; }
        .own-message { color: green; }
        .other-message { color: blue; }
        .system-message { color: gray; font-style: italic; }
        #status { margin-bottom: 10px; }
    </style>
</head>
<body>
<div id="status">Статус: Не подключен</div>
<div id="chat"></div>

<input id="chatId" placeholder="Chat ID" value="1">
<select id="chatType">
    <option value="PERSONAL">PERSONAL</option>
    <option value="GROUP">GROUP</option>
</select>
<input id="messageInput" placeholder="Введите сообщение">
<button id="sendBtn">Отправить</button>

<input id="mediaIdInput" placeholder="Media ID">
<button id="sendMediaBtn">Отправить медиа</button>

<hr>
<input id="tokenInput" placeholder="JWT Token">
<button id="setTokenBtn">Установить токен</button>

<script>
    class SimpleChatWS {
        constructor() {
            this.ws = null;
            this.chatDiv = document.getElementById('chat');
            this.statusDiv = document.getElementById('status');
            this.messageInput = document.getElementById('messageInput');
            this.chatIdInput = document.getElementById('chatId');
            this.chatTypeSelect = document.getElementById('chatType');
            this.tokenInput = document.getElementById('tokenInput');
            this.setTokenBtn = document.getElementById('setTokenBtn');

            this.chatId = parseInt(this.chatIdInput.value);
            this.chatType = this.chatTypeSelect.value;

            this.bindEvents();
            this.connect();
        }

        bindEvents() {
            this.sendBtn = document.getElementById('sendBtn');
            this.sendBtn.onclick = () => this.sendMessage();

            this.sendMediaBtn = document.getElementById('sendMediaBtn');
            this.mediaIdInput = document.getElementById('mediaIdInput');

            this.sendMediaBtn.onclick = () => this.sendMediaMessage();

            this.setTokenBtn.onclick = () => {
                const token = this.tokenInput.value.trim();
                if (token) {
                    localStorage.setItem('token', token);
                    alert('Токен обновлён! Переподключаемся...');
                    this.disconnect(() => this.connect());
                }
            };

            this.chatIdInput.addEventListener('change', () => this.updateChat());
            this.chatTypeSelect.addEventListener('change', () => this.updateChat());
        }

        connect() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Введите токен!');
                return;
            }

            const chatId = parseInt(this.chatIdInput.value);
            const chatType = this.chatTypeSelect.value;

            this.ws = new WebSocket(`http://localhost:8080/ws/chat?token=${token}`);

            this.ws.onopen = () => {
                this.updateStatus('✅ Подключен к WebSocket');
                console.log('WebSocket connected');
            };

            this.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Принято MessageResult
                    const msg = data.isSuccess ? data.success : { senderId: 0, content: data.error.message };
                    this.displayMessage(msg);
                } catch (e) {
                    console.error('Ошибка разбора сообщения', e);
                }
            };

            this.ws.onclose = () => {
                this.updateStatus('🔌 WebSocket отключён, переподключаемся...');
                console.log('WebSocket closed, reconnect in 5s');
                setTimeout(() => this.connect(), 5000);
            };

            this.ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }

        disconnect(callback) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.close();
            }
            callback && callback();
        }

        updateChat() {
            // Можно реализовать unsubscribe/subscribe logic на backend, но у нас пока нет
            this.chatId = parseInt(this.chatIdInput.value);
            this.chatType = this.chatTypeSelect.value;
        }

        sendMessage() {
            const content = this.messageInput.value.trim();
            if (!content) return;
            if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                alert('Сначала подключитесь к WebSocket!');
                return;
            }

            const payload = {
                action: 'send',
                chatId: parseInt(this.chatIdInput.value),
                chatType: this.chatTypeSelect.value,
                    payload: {
                        type: 'TEXT',
                        text: content
                    },
                messageType: 'TEXT'
            };

            this.ws.send(JSON.stringify(payload));
            this.messageInput.value = '';
        }

        sendMediaMessage() {
            const content = this.mediaIdInput.value.trim();
            if (!content) return;
            if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                alert('Сначала подключитесь к WebSocket!');
                return;
            }

            const payload = {
                action: 'send',
                chatId: parseInt(this.chatIdInput.value),
                chatType: this.chatTypeSelect.value,
                payload: {
                    type: 'MEDIA',
                    mediaId: parseInt(this.mediaIdInput.value)
                },
                messageType: 'MEDIA'
            };

            this.ws.send(JSON.stringify(payload));
            this.messageInput.value = '';
        }

        displayMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';

            // Можно улучшить выделение своих сообщений, если есть userId
            if (msg.senderId === 0) div.classList.add('system-message');
            else div.classList.add('other-message');

            const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString() : '';
            let content = '';

            if (msg.payload) {
                if (msg.payload.text) {
                    content = msg.payload.text;
                } else if (msg.payload.mediaId) {
                    content = `[media: ${msg.payload.mediaId}]`;
                }
            }

            div.innerHTML = `<strong>${msg.senderId}</strong> [${time}]: ${content}`;
            this.chatDiv.appendChild(div);
            this.chatDiv.scrollTop = this.chatDiv.scrollHeight;
        }

        updateStatus(text) {
            this.statusDiv.textContent = `Статус: ${text}`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.chat = new SimpleChatWS();
    });
</script>
</body>
</html>
